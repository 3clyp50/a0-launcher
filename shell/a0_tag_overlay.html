<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A0 Tag</title>
  <link rel="stylesheet" href="../app/a0ui/index.css">
  <link rel="stylesheet" href="../app/a0ui/css/buttons.css">
  <link rel="stylesheet" href="../app/a0ui/vendor/google/google-icons.css">
  <link rel="stylesheet" href="a0_tag_overlay.css">
</head>
<body data-view="result" data-kind="working">
  <main id="a0TagResult" class="a0-tag-card" role="status" aria-live="polite">
    <div class="a0-tag-mark" aria-hidden="true">A0</div>
    <div class="a0-tag-content">
      <h1 id="a0TagTitle">Agent Zero</h1>
      <p id="a0TagMessage">Working…</p>
      <div id="a0TagActions" class="a0-tag-actions" hidden>
        <button id="a0TagCopy" class="button" type="button" hidden>Copy</button>
        <button id="a0TagDismiss" class="button confirm" type="button">Dismiss</button>
      </div>
    </div>
  </main>
  <form id="a0TagComposer" class="a0-tag-composer" hidden>
    <header class="a0-tag-composer-header">
      <img class="a0-tag-symbol" src="../app/assets/darkSymbol.svg" alt="">
      <div class="a0-tag-composer-title">
        <strong>Ask Agent Zero to use your computer</strong>
      </div>
      <label class="a0-tag-profile">
        <span>Profile</span>
        <select id="a0TagProfile" aria-label="Agent profile"></select>
      </label>
      <button id="a0TagComposerClose" class="a0-tag-close" type="button" aria-label="Close A0 Tag">×</button>
    </header>
    <div class="a0-tag-compose-box">
      <div class="a0-tag-attachment-wrapper">
        <button id="a0TagAttachmentTrigger" class="a0-tag-attachment-trigger" type="button" aria-label="More actions" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div id="a0TagAttachmentMenu" class="a0-tag-attachment-menu" role="menu" hidden>
          <div class="a0-tag-attachment-menu-items">
            <button id="a0TagAttachFile" class="a0-tag-attachment-menu-item" type="button" role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" />
              </svg>
              <span>Attach file</span>
            </button>
            <button id="a0TagAttachFolder" class="a0-tag-attachment-menu-item" type="button" role="menuitem">
              <span class="material-symbols-outlined" aria-hidden="true">drive_folder_upload</span>
              <span>Attach folder</span>
            </button>
          </div>
        </div>
      </div>
      <textarea id="a0TagQuery" rows="1" placeholder="Type your message here..." aria-label="A0 Tag request" required></textarea>
      <button id="a0TagMicrophone" class="a0-tag-microphone" type="button" aria-label="Start voice input" aria-pressed="false">
        <svg viewBox="0 0 16 18" aria-hidden="true">
          <path d="m8,12c1.66,0,3-1.34,3-3V3c0-1.66-1.34-3-3-3s-3,1.34-3,3v6c0,1.66,1.34,3,3,3Zm-1,1.9c-2.7-.4-4.8-2.6-5-5.4H0c.2,3.8,3.1,6.9,7,7.5v2h2v-2c3.9-.6,6.8-3.7,7-7.5h-2c-.2,2.8-2.3,5-5,5.4h-2Z"/>
        </svg>
      </button>
      <button id="a0TagSubmit" class="a0-tag-submit" type="submit" aria-label="Send to Agent Zero" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
    <footer class="a0-tag-composer-footer">
      <div class="a0-tag-footer-left">
        <span id="a0TagMicrophoneStatus" class="a0-tag-microphone-status" hidden></span>
        <span id="a0TagAttachmentSummary" class="a0-tag-attachment-summary" hidden>
          <span id="a0TagAttachmentSummaryText"></span>
          <button id="a0TagAttachmentClear" type="button" aria-label="Remove all attachments">×</button>
        </span>
      </div>
      <span class="a0-tag-key-hint">Enter to send · Shift+Enter for a new line</span>
    </footer>
  </form>
  <div id="a0TagToast" class="a0-tag-toast" role="status" aria-live="polite" hidden>
    <strong id="a0TagToastTitle">Whisper STT</strong>
    <span id="a0TagToastMessage"></span>
  </div>
  <script src="a0_tag_overlay.js"></script>
</body>
</html>
